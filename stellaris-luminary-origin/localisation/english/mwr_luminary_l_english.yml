l_english:
 origin_mwr_luminary:0 "Children of the Luminary"
 origin_mwr_luminary_desc:0 "Something reached into our world from beyond. The otherworldly Whisperers slipped into the minds of millions, turning neighbour on neighbour and nation on nation. The civil wars that followed ended in nuclear fire.\n\nFrom the ashes rose the Luminary, whose mind alone the Whisperers could not touch. With the warded survivors at their side, they conquered what remained of the homeworld and bound it together under a single promise: we will leave these ashes behind and take our people to the stars."
 civic_tooltip_mwr_luminary_effects:0 "- Capital is a §YTomb World§!; species gains §YSurvivor§! and prefers Tomb Worlds\n- Ruler is §YThe Luminary§!, an immortal legendary leader\n- Capital gains §YMindward Bastion§! and the temporary §YWhispering Scars§!\n- Empire gains §YOath of the Stars§! while the Luminary lives"
 leader_trait_mwr_luminary:0 "The Luminary"
 leader_trait_mwr_luminary_desc:0 "The one mind the Whisperers could not break. Conqueror of the ashes, keeper of the promise of the stars."
 mwr_mindward_bastion:0 "Mindward Bastion"
 mwr_mindward_bastion_desc:0 "The warded vaults where the Luminary's followers sheltered from the Whisperers now form the heart of the capital."
 mwr_oath_of_stars:0 "Oath of the Stars"
 mwr_oath_of_stars_desc:0 "Every citizen swore to follow the Luminary off this broken world."
 mwr_whispering_scars:0 "Whispering Scars"
 mwr_whispering_scars_desc:0 "The Whisperers' touch lingers in the minds of the survivors and the ruins they left behind."
 mwr_luminary.2.name:0 "From the Ashes"
 mwr_luminary.2.desc:0 "The histories call it the Madness. Voices from beyond reality took hold of our people, and the wars they sowed ended only when the bombs fell.\n\nThe Luminary gathered the warded and the willing and conquered the shattered remnants one by one. Today the last holdout swore fealty. Our world is united, ruined but whole, and the Luminary's eyes are already on the sky."
 mwr_luminary.2.a:0 "To the stars, as promised."
 mwr_luminary.3.name:0 "The Whisperers Stir"
 mwr_luminary.3.desc:0 "Nightmares are spreading through the capital once more. The Luminary says the old wounds can finally be closed. But how?"
 mwr_luminary.3.a:0 "Rally the people around the Luminary."
 mwr_luminary.3.b:0 "Study the scars. Know the enemy."
 mwr_luminary.4.name:0 "The Light Goes Out"
 mwr_luminary.4.desc:0 "The Luminary is dead. Keeping the oath they gave us now falls to us."
 mwr_luminary.4.a:0 "We will keep the promise."
