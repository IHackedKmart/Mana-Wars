l_english:
 mwr_prologue.1.name:0 "The Madness"
 mwr_prologue.1.desc:0 "It began with dreams. Then voices. Then whole cities rose as one to tear down their neighbours, puppets of the Whisperers beyond the veil. In the Luminary's warded vaults, the question remains: what is to be done with those the Whisperers once touched?"
 mwr_prologue.1.a:0 "They cannot be trusted. Purge the Touched."
 mwr_prologue.1.b:0 "They were victims too. Heal them."
 mwr_prologue.2.name:0 "The Burning"
 mwr_prologue.2.desc:0 "The civil wars spread across every continent. At last some puppet-faction reached the launch codes, and the sky caught fire. Billions died. In the ash, scavengers pick over the ruins."
 mwr_prologue.2.a:0 "Strip the ruins for materials."
 mwr_prologue.2.b:0 "Gather the knowledge of the dead."
 mwr_prologue.3.name:0 "The Conquest of the Ashes"
 mwr_prologue.3.desc:0 "Warlords, cults and Whisperer-puppets still hold the wastes. The Luminary marches out of the vaults to take what remains of the world. How will the conquest be remembered?"
 mwr_prologue.3.a:0 "With iron. None will resist us again."
 mwr_prologue.3.b:0 "With mercy. Every survivor is precious."
 mwr_prologue.3.c:0 "With wards. We carry the shield to every city."
 mwr_prologue.4.name:0 "The Unifying Promise"
 mwr_prologue.4.desc:0 "Before the assembled survivors, the Luminary swears three oaths:\n\n§YLeave the Ashes§!: our people will live on §Y3§! worlds within 20 years.\n§YNever Again§!: we will understand the Whisperers (§YPsionic Theory§!) within 30 years.\n§YRebuild§!: the scars will be healed and we will hold §Y6§! worlds within 40 years.\n\nThe crowd roars. Promises like these must be kept."
 mwr_prologue.4.a:0 "We will hold you to them, Luminary."
 mwr_promise.kept:0 "The Luminary keeps their word."
 mwr_promise.broken:0 "The people remember."
 mwr_promise.broken.desc:0 "The time has passed, and the oath is unfulfilled. Murmurs of doubt spread through the settlements. Is the Luminary just another warlord after all?"
 mwr_promise.1.name:0 "Promise Kept: Leave the Ashes"
 mwr_promise.1.desc:0 "Our people now live on more than one world. The first oath is fulfilled."
 mwr_promise.2.name:0 "Promise Kept: Never Again"
 mwr_promise.2.desc:0 "We finally understand the realm the Whisperers came from. They will never take our minds unawares again."
 mwr_promise.3.name:0 "Promise Kept: Rebuild"
 mwr_promise.3.desc:0 "The scars are healed and our civilization spans many worlds. The ashes are behind us."
 mwr_promise.11.name:0 "Promise Broken: Leave the Ashes"
 mwr_promise.12.name:0 "Promise Broken: Never Again"
 mwr_promise.13.name:0 "Promise Broken: Rebuild"
 mwr_promise.20.name:0 "The Oaths Fulfilled"
 mwr_promise.20.desc:0 "The time of the three oaths has ended. History will now judge the Luminary."
 mwr_promise.20.a:0 "Every promise kept. The dream of the stars lives!"
 mwr_promise.20.b:0 "Not every promise was kept, but we endure."
 mwr_holdouts.2.name:0 "The Wasteland Strongholds Fall"
 mwr_holdouts.2.desc:0 "The largest warlord fortresses have surrendered. Their stockpiles and their people are ours."
 mwr_holdouts.2.a:0 "Seize the stockpiles."
 mwr_holdouts.2.b:0 "Welcome their people."
 mwr_holdouts.3.name:0 "The Last Cult"
 mwr_holdouts.3.desc:0 "Only one band of Whisperer-worshippers remains, deep in the irradiated wastes."
 mwr_holdouts.3.a:0 "Finish it."
 mwr_holdouts.4.name:0 "One World, One Rule"
 mwr_holdouts.4.desc:0 "For the first time since the Madness, no one on our homeworld stands against the Luminary."
 mwr_holdouts.4.a:0 "Under one rule, we are whole."
 mwr_whisper.2.name:0 "Whispers in the Dark"
 mwr_whisper.2.desc:0 "Ward-keepers report the old voices pressing against the shields again. Power to the wards must be increased, or people will start to dream."
 mwr_whisper.2.a:0 "Divert power to the wards."
 mwr_whisper.2.b:0 "Let them dream. The wards will hold."
 mwr_whisper.3.name:0 "The Veil Thins"
 mwr_whisper.3.desc:0 "Citizens are hearing the voices while awake. If the wards fail, the Madness will return."
 mwr_whisper.3.a:0 "Strengthen the wards, whatever it costs!"
 mwr_whisper.4.name:0 "The Madness Returns"
 mwr_whisper.4.desc:0 "The wards have broken. Across our worlds, people turn on each other as the Whisperers pour through. We must rebuild the shields from nothing."
 mwr_whisper.4.a:0 "Not again. Never again."
 mwr_whisper.5.name:0 "The Wards Sealed"
 mwr_whisper.5.desc:0 "The ward-network is complete. The Whisperers' voices fade into silence, perhaps forever."
 mwr_whisper.5.a:0 "Our minds are our own."
 mwr_vaults.1.name:0 "The Sealed Vault"
 mwr_vaults.1.desc:0 "Survey teams have found a pre-war vault, still sealed and still powered, beneath the radioactive ruins of an old capital."
 mwr_vaults.1.a:0 "Open it carefully."
 mwr_vaults.1.b:0 "Strip it for parts."
 mwr_vaults.2.name:0 "Archives of the Old World"
 mwr_vaults.2.desc:0 "Inside are complete records of pre-war science, including the first studies of the Whisperers."
 mwr_vaults.2.a:0 "Knowledge is our inheritance."
 mwr_vaults.3.name:0 "Greening the Wastes"
 mwr_vaults.3.desc:0 "Using vault terraforming plans, our engineers can reclaim the fallout zones."
 mwr_vaults.3.a:0 "Reclaim the land."
 mwr_vaults.3.b:0 "Preserve the ruins as a memorial."
 mwr_succession.2.name:0 "The Light Endures"
 mwr_succession.2.desc:0 "The succession war is over. The Luminary's legacy has outlasted them."
 mwr_succession.2.a:0 "Their light guides us still."
 mwr_succession.3.name:0 "A Shattered Legacy"
 mwr_succession.3.desc:0 "No heir could hold the Luminary's people together. The nation survives, but the dream is broken."
 mwr_succession.3.a:0 "We will rebuild, again."
 situation_mwr_holdouts:0 "The Last Holdouts"
 situation_mwr_holdouts_desc:0 "Warlords and Whisperer cults left over from the civil wars still resist the Luminary's rule."
 situation_mwr_holdouts_crush:0 "Crush Them"
 situation_mwr_holdouts_crush_desc:0 "Quick, brutal pacification."
 situation_mwr_holdouts_reconcile:0 "Reconcile"
 situation_mwr_holdouts_reconcile_desc:0 "Bring the holdouts in with diplomacy and concessions."
 situation_mwr_holdouts_1:0 "Open Resistance"
 situation_mwr_holdouts_2:0 "Scattered Remnants"
 situation_mwr_holdouts_3:0 "Final Holdouts"
 situation_mwr_whisperers:0 "The Whisperers"
 situation_mwr_whisperers_desc:0 "The entities that caused the Madness still press against our wards. If progress reaches 100, the wards break. If it falls to 0, they are sealed for good."
 situation_mwr_whisperers_maintain:0 "Maintain the Wards"
 situation_mwr_whisperers_maintain_desc:0 "Keep the shields at their normal strength."
 situation_mwr_whisperers_strengthen:0 "Strengthen the Wards"
 situation_mwr_whisperers_strengthen_desc:0 "Push the Whisperers back, at a heavy cost in energy."
 situation_mwr_whisperers_1:0 "Distant Murmurs"
 situation_mwr_whisperers_2:0 "Waking Whispers"
 situation_mwr_whisperers_3:0 "The Veil Thins"
 situation_mwr_fading_light:0 "The Fading Light"
 situation_mwr_fading_light_desc:0 "With the Luminary gone, rival heirs fight over their legacy. Restore order before the nation splits apart."
 situation_mwr_fading_light_legacy:0 "Honour the Legacy"
 situation_mwr_fading_light_legacy_desc:0 "Unite the factions around the Luminary's memory."
 situation_mwr_fading_light_force:0 "Restore Order by Force"
 situation_mwr_fading_light_force_desc:0 "Crush the pretenders."
 situation_mwr_fading_light_1:0 "Open Civil War"
 situation_mwr_fading_light_2:0 "Fragile Truce"
 situation_mwr_fading_light_3:0 "Order Restored"
