name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          mkdir -p "$HOME/bin"
          cd "$HOME/bin"
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -o luau.zip
          curl -sSL -o lune.zip https://github.com/lune-org/lune/releases/download/v0.8.9/lune-0.8.9-linux-x86_64.zip
          unzip -o lune.zip
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -o rojo.zip
          curl -sSL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          unzip -o stylua.zip
          curl -sSL -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          unzip -o lsp.zip
          curl -sSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.70.1/scripts/globalTypes.d.luau
          chmod +x luau lune rojo stylua luau-lsp
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Formatting
        run: stylua --check src tests tools/sim

      - name: Type check
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --sourcemap=sourcemap.json --definitions="$HOME/bin/globalTypes.d.luau" --no-strict-dm-types src/

      - name: Glyph check (no characters Roblox draws as squares)
        run: lune run tools/sim/glyphs

      - name: Unit tests
        run: python3 tools/run_tests.py luau

      - name: Combat simulation
        run: lune run tools/sim/combat

      - name: Client integration test
        run: lune run tools/sim/client

      - name: Match simulation
        run: lune run tools/sim/match

      - name: Map generation test
        run: lune run tools/sim/maps

      - name: Build place file
        run: rojo build default.project.json -o ManaWars.rbxlx

      - uses: actions/upload-artifact@v4
        with:
          name: ManaWars-place
          path: ManaWars.rbxlx
